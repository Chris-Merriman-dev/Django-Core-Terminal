name: Django CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      DJANGO_SETTINGS_MODULE: capstone.settings
      DJANGO_SECRET_KEY: "ci-test-key-2026"
      GITHUB_ACTIONS: "true"
      PYTHONFAULTHANDLER: 1
      DJANGO_DEBUG: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Firefox and Geckodriver
        run: |
          sudo apt-get update

          # Install Firefox + required system dependencies for CI
          sudo apt-get install -y firefox wget tar \
            libgtk-3-0 libdbus-glib-1-2 libx11-xcb1 libxt6 \
            libxcomposite1 libxdamage1 libxrandr2 libasound2

          # Install geckodriver
          wget -O geckodriver.tar.gz https://github.com/mozilla/geckodriver/releases/download/v0.34.0/geckodriver-v0.34.0-linux64.tar.gz
          
          tar -xvzf geckodriver.tar.gz
          chmod +x geckodriver
          sudo mv geckodriver /usr/local/bin/

          # Verify installs
          firefox --version
          geckodriver --version

      - name: Debug Environment
        run: |
          echo "Python version:"
          python --version

          echo "Installed packages:"
          pip list

          echo "Firefox version:"
          firefox --version

          echo "Geckodriver version:"
          geckodriver --version

      - name: Run Django Tests
        run: |
          python manage.py migrate --noinput
          python -X faulthandler manage.py test --noinput -v 3 --keepdb --failfast