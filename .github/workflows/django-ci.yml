name: Django CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      DJANGO_SETTINGS_MODULE: capstone.settings
      DJANGO_SECRET_KEY: "ci-test-key-2026"
      GITHUB_ACTIONS: "true"
      PYTHONFAULTHANDLER: 1
      DJANGO_DEBUG: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ Install Chrome ONLY
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

          google-chrome --version

      # ❌ REMOVE chromedriver install step entirely

      # Optional (usually not needed, but safe)
      - name: Fix shared memory
        run: |
          sudo mount -o remount,size=2G /dev/shm || true

      - name: Debug Environment
        run: |
          python --version
          pip list
          google-chrome --version

      - name: Run Django Tests
        run: |
          python manage.py migrate --noinput
          python -X faulthandler manage.py test --noinput -v 3 --keepdb --failfast