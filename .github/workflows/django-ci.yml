name: Django CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      DJANGO_SETTINGS_MODULE: capstone.settings
      DJANGO_SECRET_KEY: "ci-test-key-2026"
      GITHUB_ACTIONS: "true"
      PYTHONFAULTHANDLER: 1
      DJANGO_DEBUG: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip jq

          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

          google-chrome --version

      - name: Install Chromedriver
        run: |
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}' | cut -d '.' -f 1)
          echo "Chrome major version: $CHROME_VERSION"

          DRIVER_URL=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/latest-versions-per-milestone-with-downloads.json \
            | jq -r --arg v "$CHROME_VERSION" '.milestones[$v].downloads.chromedriver[] | select(.platform=="linux64") | .url')

          echo "Driver URL: $DRIVER_URL"

          wget -O chromedriver.zip "$DRIVER_URL"

          unzip chromedriver.zip
          sudo mv chromedriver-linux64/chromedriver /usr/bin/chromedriver
          sudo chmod +x /usr/bin/chromedriver

          chromedriver --version

      # ✅ THIS is the critical fix
      - name: Fix shared memory issue
        run: |
          sudo mount -o remount,size=2G /dev/shm

      - name: Debug Environment
        run: |
          echo "Python version:"
          python --version

          echo "Installed packages:"
          pip list

          echo "Chrome version:"
          google-chrome --version

          echo "Chromedriver version:"
          chromedriver --version

      - name: Run Django Tests
        run: |
          python manage.py migrate --noinput
          python -X faulthandler manage.py test --noinput -v 3 --keepdb --failfast